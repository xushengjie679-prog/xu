<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五子棋 AI 对战</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f3efe3;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 18px;
      color: #222;
    }
    .app {
      width: min(96vw, 980px);
      display: grid;
      grid-template-columns: 1fr 260px;
      gap: 18px;
      align-items: start;
    }
    .board-wrap {
      overflow: auto;
      background: #d9a94b;
      border: 6px solid #8b5a18;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
    }
    canvas {
      display: block;
      background: #d8a84b;
      cursor: pointer;
      touch-action: manipulation;
    }
    .panel {
      background: #fffaf0;
      border: 1px solid #d7c391;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 12px; font-size: 24px; }
    .status {
      font-size: 18px;
      font-weight: 700;
      margin: 12px 0;
      min-height: 52px;
      line-height: 1.45;
    }
    button, select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid #b59a5a;
      background: white;
      margin-top: 10px;
      font-size: 15px;
    }
    button {
      background: #222;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { opacity: .9; }
    .tip {
      margin-top: 14px;
      line-height: 1.6;
      font-size: 14px;
      color: #555;
    }
    .score {
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      background: #f5edd9;
      font-size: 14px;
      line-height: 1.7;
    }
    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .panel { order: -1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="board-wrap">
      <canvas id="board" width="760" height="760"></canvas>
    </div>
    <div class="panel">
      <h1>五子棋 AI 对战</h1>
      <div class="status" id="status">你执黑先手。点击棋盘落子。</div>
      <label>棋盘大小</label>
      <select id="sizeSelect">
        <option value="15">15 × 15 标准</option>
        <option value="19" selected>19 × 19 大棋盘</option>
        <option value="21">21 × 21 超大棋盘</option>
      </select>
      <button id="restart">重新开始</button>
      <button id="undo">悔一步</button>
      <div class="score">
        黑棋：你<br />白棋：AI<br />目标：横、竖、斜任意方向连成 5 子。
      </div>
      <div class="tip">
        说明：这个 AI 不是摆设，会优先堵你的四连、三连，也会寻找自己的进攻点。你先练基本胜负判断，别急着追求复杂算法。
      </div>
    </div>
  </div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const restartBtn = document.getElementById('restart');
const undoBtn = document.getElementById('undo');
const sizeSelect = document.getElementById('sizeSelect');

let size = Number(sizeSelect.value);
let cell, margin;
let board = [];
let gameOver = false;
let thinking = false;
let history = [];

function init() {
  size = Number(sizeSelect.value);
  board = Array.from({ length: size }, () => Array(size).fill(0));
  history = [];
  gameOver = false;
  thinking = false;
  resizeBoard();
  statusEl.textContent = '你执黑先手。点击棋盘落子。';
  draw();
}

function resizeBoard() {
  const cssSize = Math.min(760, Math.max(520, window.innerWidth - 60));
  canvas.width = cssSize;
  canvas.height = cssSize;
  margin = cssSize * 0.055;
  cell = (cssSize - margin * 2) / (size - 1);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#d8a84b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#3b2610';
  ctx.lineWidth = 1;
  for (let i = 0; i < size; i++) {
    const p = margin + i * cell;
    ctx.beginPath();
    ctx.moveTo(margin, p);
    ctx.lineTo(canvas.width - margin, p);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p, margin);
    ctx.lineTo(p, canvas.height - margin);
    ctx.stroke();
  }

  const stars = getStars();
  ctx.fillStyle = '#3b2610';
  stars.forEach(([x, y]) => {
    ctx.beginPath();
    ctx.arc(margin + x * cell, margin + y * cell, 4, 0, Math.PI * 2);
    ctx.fill();
  });

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (board[y][x]) drawStone(x, y, board[y][x]);
    }
  }
}

function getStars() {
  if (size === 15) return [[3,3],[11,3],[7,7],[3,11],[11,11]];
  if (size === 19) return [[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]];
  return [[3,3],[10,3],[17,3],[3,10],[10,10],[17,10],[3,17],[10,17],[17,17]];
}

function drawStone(x, y, player) {
  const px = margin + x * cell;
  const py = margin + y * cell;
  const r = cell * 0.42;
  const g = ctx.createRadialGradient(px - r/3, py - r/3, r/6, px, py, r);
  if (player === 1) {
    g.addColorStop(0, '#666');
    g.addColorStop(1, '#000');
  } else {
    g.addColorStop(0, '#fff');
    g.addColorStop(1, '#cfcfcf');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(px, py, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = player === 1 ? '#111' : '#aaa';
  ctx.stroke();
}

canvas.addEventListener('click', (e) => {
  if (gameOver || thinking) return;
  const rect = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left - margin) / cell);
  const y = Math.round((e.clientY - rect.top - margin) / cell);
  if (!inBoard(x, y) || board[y][x] !== 0) return;
  move(x, y, 1);
  if (checkWin(x, y, 1)) return endGame('你赢了。AI 这局被你打穿了。');
  thinking = true;
  statusEl.textContent = 'AI 正在思考...';
  setTimeout(aiMove, 180);
});

function move(x, y, player) {
  board[y][x] = player;
  history.push({x, y, player});
  draw();
}

function aiMove() {
  const best = findBestMove();
  if (!best) return endGame('平局。棋盘已满。');
  move(best.x, best.y, 2);
  thinking = false;
  if (checkWin(best.x, best.y, 2)) return endGame('AI 赢了。别急，这说明你防守漏了。');
  statusEl.textContent = '轮到你。黑棋落子。';
}

function findBestMove() {
  let best = null;
  let bestScore = -Infinity;
  const candidates = getCandidates();
  for (const {x, y} of candidates) {
    const attack = evaluatePoint(x, y, 2);
    const defend = evaluatePoint(x, y, 1);
    const centerBias = 20 - Math.hypot(x - size/2, y - size/2);
    const score = Math.max(attack, defend * 1.08) + centerBias;
    if (score > bestScore) {
      bestScore = score;
      best = {x, y};
    }
  }
  return best;
}

function getCandidates() {
  const set = new Set();
  if (history.length === 0) return [{x: Math.floor(size/2), y: Math.floor(size/2)}];
  for (const h of history) {
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        const x = h.x + dx, y = h.y + dy;
        if (inBoard(x, y) && board[y][x] === 0) set.add(x + ',' + y);
      }
    }
  }
  return [...set].map(s => {
    const [x, y] = s.split(',').map(Number);
    return {x, y};
  });
}

function evaluatePoint(x, y, player) {
  let score = 0;
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (const [dx, dy] of dirs) {
    const line = countLine(x, y, dx, dy, player);
    score += patternScore(line.count, line.openEnds);
  }
  return score;
}

function countLine(x, y, dx, dy, player) {
  let count = 1;
  let openEnds = 0;
  let nx = x + dx, ny = y + dy;
  while (inBoard(nx, ny) && board[ny][nx] === player) { count++; nx += dx; ny += dy; }
  if (inBoard(nx, ny) && board[ny][nx] === 0) openEnds++;
  nx = x - dx; ny = y - dy;
  while (inBoard(nx, ny) && board[ny][nx] === player) { count++; nx -= dx; ny -= dy; }
  if (inBoard(nx, ny) && board[ny][nx] === 0) openEnds++;
  return {count, openEnds};
}

function patternScore(count, openEnds) {
  if (count >= 5) return 1000000;
  if (count === 4 && openEnds === 2) return 200000;
  if (count === 4 && openEnds === 1) return 60000;
  if (count === 3 && openEnds === 2) return 15000;
  if (count === 3 && openEnds === 1) return 3500;
  if (count === 2 && openEnds === 2) return 1200;
  if (count === 2 && openEnds === 1) return 250;
  if (count === 1 && openEnds === 2) return 40;
  return 5;
}

function checkWin(x, y, player) {
  return [[1,0],[0,1],[1,1],[1,-1]].some(([dx, dy]) => {
    return countLine(x, y, dx, dy, player).count >= 5;
  });
}

function endGame(text) {
  gameOver = true;
  thinking = false;
  statusEl.textContent = text;
}

function inBoard(x, y) {
  return x >= 0 && y >= 0 && x < size && y < size;
}

restartBtn.addEventListener('click', init);
sizeSelect.addEventListener('change', init);
undoBtn.addEventListener('click', () => {
  if (thinking || history.length === 0) return;
  for (let i = 0; i < 2 && history.length; i++) {
    const h = history.pop();
    board[h.y][h.x] = 0;
  }
  gameOver = false;
  statusEl.textContent = '已悔棋，轮到你。';
  draw();
});
window.addEventListener('resize', () => { resizeBoard(); draw(); });
init();
</script>
</body>
</html>
